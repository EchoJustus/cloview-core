# The Windows verification harness (verify/run-windows-checks.ps1) on a GitHub-hosted
# Windows runner: JavaFX, real WPF and Flutter (the fitness benchmark on all three hosts
# runs in cloview-examples' windows-harness workflow).
# Manual for now (Actions > windows-harness > Run workflow, or `gh workflow run
# windows-harness.yml`). Its first runs may need fixes; once green, it can also run on
# pushes to main. The artifact holds the same results zip the owner used to upload by hand.
# The job passes only when every harness step is "ok": in CI a skipped step fails too
# (the Verdict step; docs/topics/ci-windows-harness-green.md). R is the runner image's;
# the step before the harness adds the packages of the real-R bridge test.
#
# A self-hosted runner on your own PC (runs-on: [self-hosted, Windows]) is possible, but
# keep this workflow dispatch-only then: GitHub advises that self-hosted runners "should
# almost never be used for public repositories" (docs/DEVELOPMENT_WORKFLOW.md §3).
name: windows-harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Windows harness (steps 01-06)
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # the summary and verdict steps (ops/tools/ci_summary.py)

      # Without jsonlite, backend.R exits at once and the real-R test of the bridge fails
      # on the JVM and on the CLR (steps 02 and 04). The versions go to the job summary;
      # loadNamespace() fails the step if a package did not install or cannot be loaded,
      # since backend.R would otherwise fall back to base graphics without a word.
      - name: R packages for the real-R bridge test
        shell: Rscript {0}
        run: |
          pkgs <- c("jsonlite", "ggplot2", "ragg", "svglite")
          install.packages(pkgs, repos = "https://cloud.r-project.org", type = "binary")
          versions <- c(paste(R.version.string, "in", R.home()),
                        paste(pkgs, vapply(pkgs, function(p) {
                          loadNamespace(p)
                          format(packageVersion(p))
                        }, "")))
          writeLines(versions)
          cat("### R for the real-R bridge test", "", "```", versions, "```", "",
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = "\n", append = TRUE)

      - name: Run the harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\verify\run-windows-checks.ps1

      - name: Summary
        if: always()
        shell: bash
        run: python -I ops/tools/ci_summary.py verify/out >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification-results
          path: |
            verify/out/
            verify/cloview-windows-verification-results.zip
          retention-days: 14

      # Last, so that the summary and the artifact exist whatever the verdict. The harness
      # itself exits 0; this step fails the job unless every harness step is "ok".
      - name: Verdict (in CI only "ok" passes)
        if: always()
        shell: bash
        run: python -I ops/tools/ci_summary.py --require-ok verify/out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
